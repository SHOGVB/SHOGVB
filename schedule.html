<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SHOGVB | Schedule</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="site-header">

    <div class="container nav-container">

        <a href="index.html" class="logo">
            SHOGVB
        </a>

        <button class="menu-toggle" id="menuToggle">
            ☰
        </button>

        <nav class="navigation" id="navigation">
            <a href="index.html">Home</a>

            <a href="schedule.html" class="active">
                Schedule
            </a>

            <a href="photos.html">Photos</a>

            <a href="shop.html">Shop</a>

            <a href="contact.html">Contact Us</a>
        </nav>

    </div>

</header>


<main>

    <section class="page-header">

        <div class="container">

            <h1>Open Gym Schedule</h1>

            <p>
                Upcoming St. Hubert's Open Gym Volleyball sessions.
            </p>

        </div>

    </section>


    <section class="content-section">

        <div class="container">

            <div id="schedule">

                <p>
                    Loading upcoming open gyms...
                </p>

            </div>

        </div>

    </section>
<section class="calendar-section">

    <div class="container">

        <div class="calendar-header">

            <button id="previousMonth" class="calendar-button">
                ←
            </button>

            <h2 id="calendarMonth">
                Calendar
            </h2>

            <button id="nextMonth" class="calendar-button">
                →
            </button>

        </div>


        <div class="calendar">

            <div class="calendar-weekdays">

                <div>Sun</div>
                <div>Mon</div>
                <div>Tue</div>
                <div>Wed</div>
                <div>Thu</div>
                <div>Fri</div>
                <div>Sat</div>

            </div>


            <div
                id="calendarDays"
                class="calendar-days"
            ></div>

        </div>

    </div>

</section>
</main>


<footer class="site-footer">

    <div class="container">

        <p>
            © 2026 SHOGVB. All Rights Reserved.
        </p>

    </div>

</footer>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>
<script src="js/schedule.js"></script>
<script src="js/script.js"></script>

</body>

</html>
